{# Table et styles en ligne : les clients de messagerie ignorent les feuilles
   de style externes, et beaucoup ignorent aussi <style> dans <head>. #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#f4f5f7;padding:32px 16px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e3e6ea">
      <tr><td style="background:#1f3864;padding:20px 28px">
        <span style="color:#ffffff;font-size:17px;font-weight:600;letter-spacing:-0.01em">MonÉcole</span>
      </td></tr>
      <tr><td style="padding:28px">
        <p style="margin:0 0 16px;font-size:15px;color:#14171c">
          Bonjour {{ user.first_name|default:"" }},
        </p>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#4d5563">
          Une réinitialisation de mot de passe a été demandée pour votre compte
          MonÉcole ({{ school }}).
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px">
          <tr><td style="background:#1f3864;border-radius:8px">
            <a href="{{ link }}"
               style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none">
              Choisir un nouveau mot de passe
            </a>
          </td></tr>
        </table>
        <p style="margin:0 0 20px;font-size:13px;line-height:1.55;color:#6b7280">
          Ce lien est valable {{ hours }} heures et ne fonctionne qu'une seule
          fois. Si le bouton ne s'ouvre pas, copiez cette adresse dans votre
          navigateur :<br>
          <span style="word-break:break-all;color:#1f3864">{{ link }}</span>
        </p>
        <p style="margin:0;padding-top:18px;border-top:1px solid #e3e6ea;font-size:13px;line-height:1.55;color:#6b7280">
          Si vous n'êtes pas à l'origine de cette demande, ignorez ce message :
          votre mot de passe actuel reste valable et personne n'a accédé à votre
          compte.
        </p>
      </td></tr>
    </table>
  </td></tr>
</table>
