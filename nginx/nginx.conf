worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # Les photos de profil sont bornées à 8 Mo côté application ; la marge
    # couvre l'encodage multipart et l'import d'un classeur Excel.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    gzip_vary on;

    # DNS interne Docker, re-résolu régulièrement : sans cela, nginx garde
    # l'adresse d'un conteneur redémarré et sert du 502 jusqu'à son propre
    # redémarrage.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Le schéma d'origine, et non celui de ce serveur.
    #
    # Caddy termine le TLS puis relaie ici en clair. Poser `X-Forwarded-Proto:
    # $scheme` écraserait son en-tête par « http » : Django, qui redirige vers
    # HTTPS hors développement, renverrait vers Caddy, qui reviendrait ici —
    # une boucle de redirection sans fin. On respecte l'en-tête reçu et on ne
    # retombe sur `$scheme` qu'en son absence.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;

        # Interrogé par Docker : il vérifie la base, pas seulement le processus.
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location = /health/ {
            set $backend backend:8000;
            proxy_pass http://$backend;
            proxy_set_header Host $host;
        }

        # API, admin Django, statiques (whitenoise) et médias (photos, QR,
        # justificatifs) — chemins déjà préfixés dans config/urls.py.
        location ~ ^/(api|admin|static|media)/ {
            set $backend backend:8000;
            proxy_pass http://$backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Un bulletin de classe entière et un import de classeur prennent du
            # temps : la valeur par défaut de 60 s les couperait en plein PDF.
            proxy_read_timeout    180s;
            proxy_connect_timeout  10s;

            add_header X-Frame-Options         "SAMEORIGIN"                      always;
            add_header X-Content-Type-Options  "nosniff"                         always;
            add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        }

        # Le service worker, jamais mis en cache.
        #
        # C'est la panne qui a déjà coûté un écran blanc en développement : un
        # worker périmé continue de servir des fragments que le serveur ne
        # connaît plus. Un worker en cache d'une heure, c'est une heure pendant
        # laquelle un déploiement ne prend pas.
        location = /sw.js {
            set $frontend frontend:3000;
            proxy_pass http://$frontend;
            proxy_set_header Host $host;
            # `serve` pose déjà un `Cache-Control` : le masquer évite deux
            # en-têtes contradictoires en puissance dans la même réponse.
            proxy_hide_header Cache-Control;
            # Pas d'`expires` : la directive pose son propre `Cache-Control`,
            # qui s'ajoutait au nôtre et donnait deux en-têtes dans la réponse.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        # Les fragments empreintés sont immuables : leur nom change à chaque
        # contenu, donc les mettre en cache un an ne périme rien.
        location /assets/ {
            set $frontend frontend:3000;
            proxy_pass http://$frontend;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # La coquille React. Pas de cache sur le HTML : c'est lui qui désigne
        # les fragments, et le servir périmé pointe vers des fichiers effacés.
        location / {
            set $frontend frontend:3000;
            proxy_pass http://$frontend;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Frame-Options         "SAMEORIGIN"                              always;
            add_header X-Content-Type-Options  "nosniff"                                 always;
            add_header Referrer-Policy         "strict-origin-when-cross-origin"         always;
            add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
            add_header Cache-Control           "no-cache, must-revalidate"               always;
        }
    }
}
