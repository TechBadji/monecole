# Déploiement MonÉcole — Hetzner, sous Coolify, comme le projet pmc.
#
# **Aucun port n'est publié sur l'hôte.** Coolify occupe déjà 80 et 443 avec son
# propre frontal, et c'est lui qui route le domaine vers le service `nginx` et
# renouvelle le certificat. Publier un port ici ferait échouer le démarrage sur
# un conflit d'adresse.
#
# Les variables sensibles se saisissent dans Coolify, jamais dans ce fichier :
# il est suivi par git, et le dépôt est public. Voir docs/deploiement.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monecole}
      POSTGRES_USER: ${POSTGRES_USER:-monecole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monecole}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # `migrate` avant `collectstatic` : whitenoise construit son manifeste à
    # partir des fichiers rassemblés, et une migration en échec doit arrêter le
    # démarrage plutôt que de laisser tourner un schéma incomplet.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 180"
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
      # Les variables suivantes sont injectées par Coolify, saisies dans son
      # interface : DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, PUBLIC_BASE_URL,
      # POSTGRES_PASSWORD, les identifiants SMTP, SMS et Wave.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?clé de signature requise}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?domaine requis}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?adresse publique requise}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-monecole}
      POSTGRES_USER: ${POSTGRES_USER:-monecole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      LAM_ACCESS_KEY: ${LAM_ACCESS_KEY:-}
      LAM_ACCESS_PASSWORD: ${LAM_ACCESS_PASSWORD:-}
      LAM_SENDER: ${LAM_SENDER:-MONECOLE}
      WAVE_API_KEY: ${WAVE_API_KEY:-}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET:-}
    volumes:
      # Photos de profil, logos d'établissement, justificatifs de dépense : ils
      # vivent hors de l'image, sinon un redéploiement les efface.
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 192m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 32m

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    # `expose` et non `ports` : le frontal de Coolify joint ce conteneur par le
    # réseau Docker, et publier 80 sur l'hôte entrerait en conflit avec lui.
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m

volumes:
  pgdata:
  media_data:
